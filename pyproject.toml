[project]
name = "py-abyss"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "pycryptodome>=3.20",
  "rich>=13.7",
]

[project.scripts]
abyss-download = "abyssdl.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.0",
]

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["abyssdl"]
